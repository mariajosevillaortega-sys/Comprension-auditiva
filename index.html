<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#234d38">
<title>Juguemos con los cuentos — V2 plantilla dinámica</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#234d38;font-family:"Trebuchet MS","Segoe UI",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#backdrop{position:absolute;inset:-45px;background-position:center;background-size:cover;filter:blur(30px) saturate(.85) brightness(.48);transform:scale(1.08)}
#shell{position:relative;overflow:hidden;box-shadow:0 14px 50px rgba(0,0,0,.34)}
#stage{position:absolute;left:0;top:0;transform-origin:top left;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:25}
.hotspot:focus-visible{outline:6px solid #fff;outline-offset:-6px;border-radius:18px}

.tools{position:absolute;right:22px;top:20px;display:flex;gap:11px;z-index:30}
.tool{height:62px;border:4px solid #77401c;border-radius:25px;background:linear-gradient(180deg,#cf813a,#914a20);color:#fff;font-weight:950;cursor:pointer;box-shadow:0 5px 0 #693414,0 10px 18px rgba(0,0,0,.3),inset 0 2px rgba(255,255,255,.35);text-shadow:0 2px #633112}
#voiceBtn{padding:0 19px;font-size:23px}
#fullBtn{width:62px;font-size:27px}

/* Autoría integrada en la pantalla inicial */
#welcomeCredit{
  position:absolute;z-index:22;
  left:418px;top:944px;width:700px;height:42px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;
  color:#4b2a17;
  font-family:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",sans-serif;
  font-size:25px;line-height:1;font-weight:900;
  letter-spacing:.15px;
  text-shadow:none;
}

/* Botón Inicio en la pantalla de selección */
#selectionHomeBtn{
  position:absolute;z-index:38;
  left:82px;top:18px;width:112px;height:108px;
  display:block;padding:0;
  border:0;background:transparent;box-shadow:none;
  color:transparent;font-size:0;
  cursor:pointer;
}
#selectionHomeBtn:hover{transform:none}
#selectionHomeBtn:active{transform:none}
#selectionHomeBtn:focus-visible{
  outline:5px solid rgba(255,255,255,.95);
  outline-offset:2px;border-radius:50%;
}

/* Selección: contador real de 10 diamantes sobre los espacios del diseño aprobado */
#diamondRow{position:absolute;inset:0;z-index:24;pointer-events:none}
.diamond-slot{position:absolute;width:83px;height:100px;transform-origin:center center;pointer-events:none;display:flex;align-items:center;justify-content:center}
.diamond-slot .gem-png{position:absolute;left:50%;top:50%;width:79px;height:96px;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 4px rgba(60,30,5,.30)) drop-shadow(0 0 8px rgba(255,223,95,.38))}
#treasureLabel{position:absolute;left:910px;top:860px;width:230px;height:80px;z-index:25;border:0;background:transparent;color:transparent;cursor:pointer;padding:0}
#treasureLabel:focus-visible{outline:5px solid rgba(255,255,255,.9);outline-offset:2px;border-radius:22px}

/* plantilla única del cuento */
#dynamicStoryImage{
  position:absolute;z-index:10;
  left:298px;top:214px;width:940px;height:474px;
  object-fit:cover;border-radius:34px;
  box-shadow:none;
}
#dynamicStoryVideo{
  position:absolute;z-index:11;
  left:298px;top:214px;width:940px;height:474px;
  object-fit:cover;border-radius:34px;
  background:#ead9b5;
  box-shadow:none;
  display:none;
  pointer-events:none;
}
#dynamicStoryTitle{
  position:absolute;z-index:18;
  left:445px;top:50px;width:610px;height:112px;
  display:flex;align-items:center;justify-content:center;
  padding:0 18px;text-align:center;
  background:none;border:none;box-shadow:none;
  color:#4fc4ff;
  font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",sans-serif;
  font-size:64px;line-height:.92;font-weight:1000;
  letter-spacing:-1.3px;
  -webkit-text-stroke:1px rgba(255,255,255,.20);
  text-shadow:
    0 3px 0 #0b69b7,
    0 6px 0 #084f91,
    0 9px 0 rgba(93,49,20,.72),
    0 12px 15px rgba(0,0,0,.20);
}
#dynamicStoryTitle.long{font-size:54px}
#dynamicStoryTitle.very-long{font-size:47px}


/* Pantalla dinámica de preguntas aprobada */
#questionStoryTitle{
  position:absolute;z-index:18;
  left:590px;top:54px;width:900px;height:130px;
  display:flex;align-items:center;justify-content:center;
  padding:0 24px;text-align:center;
  color:#4fc4ff;
  font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",sans-serif;
  font-size:68px;line-height:.94;font-weight:1000;
  letter-spacing:-1.3px;
  text-shadow:0 3px 0 #0b69b7,0 6px 0 #084f91,0 9px 0 rgba(93,49,20,.68),0 12px 15px rgba(0,0,0,.18);
}
#questionStoryTitle.long{font-size:59px}
#questionStoryTitle.very-long{font-size:51px}

#questionCountBadge{
  position:absolute;z-index:21;
  left:824px;top:238px;width:400px;height:60px;
  display:flex;align-items:center;justify-content:center;
  border-radius:30px;
  background:linear-gradient(180deg,#ffe3a7 0%,#f7cf8c 58%,#efbd6a 100%);
  border:3px solid rgba(190,119,43,.48);
  color:#6b3515;font-size:31px;font-weight:1000;
  text-shadow:0 1px 0 rgba(255,255,255,.55);
  box-shadow:0 4px 0 rgba(157,90,30,.24),inset 0 2px 0 rgba(255,255,255,.64);
}

#questionTextDynamic{
  position:absolute;z-index:20;
  left:590px;top:344px;width:840px;height:155px;
  display:flex;align-items:center;justify-content:center;
  padding:14px 28px;text-align:center;
  color:#4a2b18;font-size:42px;line-height:1.12;font-weight:1000;
}

.answerVisualSlot{
  position:absolute;z-index:18;
  width:440px;height:200px;
  display:flex;align-items:center;justify-content:center;
  border-radius:22px;
  background:transparent;
  overflow:visible;
  padding:4px;
}
.answerVisualSlot>*{
  max-width:100%;max-height:100%;
  display:flex;align-items:center;justify-content:center;
  margin:auto;
}
.answerVisualSlot img{
  max-width:100%;max-height:100%;
  width:auto;height:auto;
  object-fit:contain;
  object-position:center center;
  filter:drop-shadow(0 7px 7px rgba(0,0,0,.14));
  display:block;
}
.answerVisualSlot img.sceneAsset{
  width:100%;height:100%;max-width:none;max-height:none;
  object-fit:contain;filter:none;background:transparent;
}
.answerVisualSlot img.smallScale{max-width:78%;max-height:78%}
.answerVisualSlot img.sizeAsset{
  width:auto;height:auto;object-fit:contain;
  filter:drop-shadow(0 7px 7px rgba(0,0,0,.14));
  transition:transform .15s ease;
}
.answerVisualSlot img.sizeSmall{max-width:56%;max-height:56%}
.answerVisualSlot img.sizeLarge{max-width:100%;max-height:100%}

#answerLeftVisual{left:565px;top:555px}
#answerRightVisual{left:1131px;top:555px}

.answerDynamicLabel{
  position:absolute;z-index:20;
  width:360px;height:58px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0 10px;
  color:#5b3016;font-size:31px;line-height:1;font-weight:1000;
  text-shadow:0 1px 0 rgba(255,255,255,.55);
}
#answerLeftLabel{left:592px;top:752px}
#answerRightLabel{left:1158px;top:752px}

.answerState{
  position:absolute;z-index:23;
  width:565px;height:300px;
  border-radius:34px;
  pointer-events:none;
  border:0 solid transparent;
  box-shadow:none;
  transition:none;
}
#answerLeftState{left:455px;top:535px}
#answerRightState{left:1035px;top:535px}
.answerState.correct{border-color:transparent;box-shadow:none}
.answerState.wrong{border-color:transparent;box-shadow:none}

#answerLeftVisual.storyShift{left:565px;top:558px;width:425px;height:190px}
#answerRightVisual.storyShift{left:1131px;top:558px;width:425px;height:190px}
.answerVisualSlot.storyShift img.sceneAsset,
.answerVisualSlot.storyShift .relationCombo{
  width:100%;height:100%;max-width:none;max-height:none;
  display:flex;align-items:center;justify-content:center;
}

/* Escenarios/lugares: más grandes para facilitar la discriminación visual.
   No afecta tamaños, colores, objetos ni relaciones. */
#answerLeftVisual.placeShift{
  left:550px;top:538px;width:490px;height:220px;
}
#answerRightVisual.placeShift{
  left:1116px;top:538px;width:490px;height:220px;
}
.answerVisualSlot.placeShift img.placeAsset{
  width:100%;height:100%;
  max-width:none;max-height:none;
  object-fit:contain;
  object-position:center center;
  filter:none;
}

.questionProgress{
  position:absolute;z-index:21;
  left:899px;top:844px;width:250px;height:58px;
  display:flex;align-items:center;justify-content:center;gap:16px;
}
.questionDot{
  width:40px;height:40px;border-radius:50%;
  background:#c6d3d6;border:4px solid rgba(255,243,214,.96);
  box-shadow:0 2px 3px rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.48);
}
.questionDot.active{
  background:linear-gradient(180deg,#45c8ff,#078de9);
  border-color:#d9f5ff;
  box-shadow:0 3px 0 #0875bd,0 3px 8px rgba(0,0,0,.18);
}

#questionFeedback{
  position:absolute;z-index:22;
  left:664px;top:902px;width:720px;height:170px;
  display:flex;align-items:center;justify-content:center;
  padding:0;border:0;background:transparent;box-shadow:none;
  opacity:0;visibility:hidden;transform:scale(.96);
  transition:opacity .16s ease,transform .16s ease,visibility .16s;
  pointer-events:none;
}
#questionFeedback.show{
  opacity:1;visibility:visible;transform:scale(1);
}
#questionFeedback.positive{
  left:664px;top:902px;width:720px;height:170px;
  padding:0;border:0;background:transparent;box-shadow:none;
}
#questionFeedback.positive img{
  display:block;
  max-width:720px;max-height:170px;
  width:auto;height:auto;
  object-fit:contain;
  filter:drop-shadow(0 7px 7px rgba(67,39,18,.20));
}
#questionFeedback.negative{
  left:654px;top:910px;width:740px;height:90px;min-height:0;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  color:#5b321b;
  font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",sans-serif;
  font-size:38px;line-height:1.08;font-weight:1000;
  text-align:center;
  text-shadow:0 2px 0 rgba(255,255,255,.48);
}

.colorBlob{
  width:170px;height:138px;border-radius:48% 52% 45% 55% / 55% 42% 58% 45%;
  background:var(--c);
  transform:rotate(-8deg);
  box-shadow:inset 10px 10px 20px rgba(255,255,255,.35),inset -10px -12px 18px rgba(0,0,0,.16),0 9px 10px rgba(0,0,0,.14);
}
.relationCombo{position:relative;width:100%;height:100%}
.relationCombo .baseScene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.48}
.relationCombo .overlayObj{position:absolute;left:50%;top:50%;transform:translate(-50%,-45%);max-width:64%;max-height:74%;object-fit:contain;filter:drop-shadow(0 6px 5px rgba(0,0,0,.22))}
.cssBed{position:relative;width:225px;height:126px}
.cssBed .mattress{position:absolute;left:26px;top:28px;width:140px;height:48px;border-radius:15px;background:linear-gradient(#f3c6b3,#e49680);box-shadow:0 7px 0 #8d5e43}
.cssBed .pillow{position:absolute;left:36px;top:20px;width:54px;height:28px;border-radius:16px;background:#fff5df;box-shadow:inset 0 -4px rgba(0,0,0,.08)}
.cssBed .head{position:absolute;left:8px;top:16px;width:24px;height:70px;border-radius:10px;background:linear-gradient(#ad6f3a,#7f4a24)}
.cssBed .leg1,.cssBed .leg2{position:absolute;bottom:0;width:14px;height:24px;background:#73451f;border-radius:0 0 6px 6px}.cssBed .leg1{left:32px}.cssBed .leg2{right:12px}



/* Botón de repetición de celebración: aparece solo con el tesoro completo */
#replayCelebrationBtn{
  position:absolute;z-index:35;
  left:1680px;top:996px;width:310px;height:112px;
  display:block;padding:0;
  border:0;background:transparent;box-shadow:none;
  color:transparent;font-size:0;
  cursor:pointer;
}
#replayCelebrationBtn:hover{transform:none}
#replayCelebrationBtn:active{transform:none}
#replayCelebrationBtn:focus-visible{
  outline:5px solid rgba(255,255,255,.95);
  outline-offset:2px;border-radius:32px;
}

/* Pantalla final de celebración funcional */
#celebrationScreen{overflow:hidden}
#confettiLayer{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.confettiPiece{position:absolute;top:-60px;width:18px;height:32px;border-radius:3px;opacity:.95;animation:confettiFall var(--dur) linear var(--delay) forwards;transform:translate3d(0,0,0) rotate(0deg)}
@keyframes confettiFall{
  0%{transform:translate3d(0,-70px,0) rotate(0deg)}
  35%{transform:translate3d(var(--drift1),330px,0) rotate(290deg)}
  70%{transform:translate3d(var(--drift2),690px,0) rotate(600deg)}
  100%{transform:translate3d(var(--drift3),1030px,0) rotate(900deg)}
}
#finalTreasureOverlay{position:absolute;inset:0;z-index:90;background:rgba(24,48,34,.60);display:none;place-items:center;backdrop-filter:blur(4px)}
#finalTreasureOverlay.show{display:grid}
.finalTreasureCard{
  width:900px;min-height:700px;padding:28px 40px 34px;
  border-radius:42px;
  background:linear-gradient(180deg,#fff4cc 0%,#f1c570 64%,#dfa44a 100%);
  border:8px solid #91491c;
  box-shadow:0 20px 55px rgba(0,0,0,.40),inset 0 4px 0 rgba(255,255,255,.68);
  text-align:center;color:#5b3016;
}
.finalTreasureCard h2{margin:0 0 4px;font-size:46px;font-weight:1000}
.finalTreasureCard p{margin:0 0 8px;font-size:26px;font-weight:900}
#finalTreasureChest{
  display:block;width:auto;height:auto;
  max-width:650px;max-height:455px;
  margin:4px auto 10px;
  object-fit:contain;
  filter:drop-shadow(0 16px 13px rgba(83,45,10,.28));
}
#finalGemRow{display:none}
#closeFinalTreasure{
  height:68px;padding:0 34px;
  border:5px solid #fff0b6;border-radius:999px;
  background:linear-gradient(#5acfff,#168ed9);
  color:#fff;font-size:26px;font-weight:1000;
  box-shadow:0 6px 0 #0b6094;cursor:pointer;
}

.overlay{position:absolute;inset:0;z-index:80;background:rgba(19,45,32,.54);display:none;place-items:center;backdrop-filter:blur(4px)}
.overlay.show{display:grid}
.textCard{width:900px;padding:30px 36px;border-radius:34px;background:linear-gradient(180deg,#fff9e8,#efd8aa);border:7px solid #ad652b;box-shadow:0 18px 45px rgba(0,0,0,.35);color:#4b2c18}
.textCard h2{margin:0 0 18px;text-align:center;font-size:42px;color:#713b17}
.textCard p{margin:0;font-size:27px;line-height:1.5;font-weight:800}
.textActions{display:flex;justify-content:center;gap:18px;margin-top:24px}
.textActions button{height:62px;padding:0 26px;border:5px solid #fff0b6;border-radius:999px;color:#fff;font-weight:950;font-size:23px;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
.listenText{background:linear-gradient(#5acfff,#158dd9)}
.closeText{background:linear-gradient(#ffd55e,#ee9820);color:#5c2d0d!important}

.simpleCard{width:690px;padding:30px 34px;border-radius:34px;background:linear-gradient(#fff7dc,#ecd09d);border:7px solid #a65e28;box-shadow:0 18px 45px rgba(0,0,0,.35);text-align:center;color:#5a2e16}
.simpleCard h2{margin:0 0 12px;font-size:42px}
.simpleCard p{margin:0 0 22px;font-size:25px;line-height:1.35;font-weight:800}
.simpleCard button{height:62px;padding:0 26px;border:5px solid #fff0b6;border-radius:999px;background:linear-gradient(#5bcfff,#158dd9);color:#fff;font-weight:950;font-size:24px;box-shadow:0 5px 0 #0b659f;cursor:pointer}
</style>
</head>
<body>
<div id="viewport">
  <div id="backdrop"></div>
  <div id="shell">
    <div id="stage">

      <section id="welcome" class="screen active">
        <img class="art" src="assets/images/img_001_5c7cea5f7ce19fd2.webp" alt="Pantalla de bienvenida">
        <div class="tools">
          <button id="voiceBtn" class="tool">🔊 Voz</button>
          <button id="fullBtn" class="tool">⛶</button>
        </div>
        <button id="playHotspot" class="hotspot" aria-label="Jugar"></button>
        <div id="welcomeCredit">Fonoaudióloga María José Villa Ortega</div>
      </section>

      <section id="selection" class="screen">
        <img class="art" src="assets/images/img_001_cb1a5e0036f2167c.jpg" alt="Pantalla de selección de cuentos">
        <button id="resetHotspot" class="hotspot" aria-label="Borrar avance e iniciar de nuevo"></button>
        <button id="selectionHomeBtn" aria-label="Volver al inicio" title="Volver al inicio">⌂</button>
        <button id="selectionVoiceHotspot" class="hotspot" aria-label="Voz"></button>
        <button id="selectionFullHotspot" class="hotspot" aria-label="Pantalla completa"></button>
        <div id="storyHotspots"></div>

        <div id="diamondRow" aria-label="Progreso del tesoro"></div>
        <button id="treasureLabel" aria-label="Ver progreso de mi tesoro">Mi tesoro</button>
        <button id="replayCelebrationBtn" aria-label="Ver nuevamente la celebración">🎉 Ver celebración</button>
      </section>

      <section id="storyScreen" class="screen">
        <img class="art" src="assets/images/img_002_4831d658102b3fff.webp" alt="Plantilla de cuento">
        <img id="dynamicStoryImage" alt="">
        <video id="dynamicStoryVideo" muted playsinline preload="auto" aria-label="Video del cuento"></video>
        <div id="dynamicStoryTitle"></div>

        <button id="storyBack" class="hotspot" aria-label="Volver a los cuentos"></button>
        <button id="storyTitleAudio" class="hotspot" aria-label="Escuchar título"></button>
        <button id="storyVoice" class="hotspot" aria-label="Voz"></button>
        <button id="storyFull" class="hotspot" aria-label="Pantalla completa"></button>
        <button id="listenStory" class="hotspot" aria-label="Escuchar cuento"></button>
        <button id="questionsHotspot" class="hotspot" aria-label="Responder preguntas"></button>
        <button id="textHotspot" class="hotspot" aria-label="Ver texto"></button>
      </section>


      <section id="questionScreen" class="screen">
        <img class="art" id="questionTemplateArt" alt="Pantalla de preguntas">

        <div id="questionStoryTitle"></div>
        <div id="questionCountBadge"></div>
        <div id="questionTextDynamic"></div>

        <div id="answerLeftVisual" class="answerVisualSlot"></div>
        <div id="answerRightVisual" class="answerVisualSlot"></div>
        <div id="answerLeftLabel" class="answerDynamicLabel"></div>
        <div id="answerRightLabel" class="answerDynamicLabel"></div>

        <div id="answerLeftState" class="answerState"></div>
        <div id="answerRightState" class="answerState"></div>

        <div id="questionProgress" class="questionProgress"></div>
        <div id="questionFeedback" aria-live="polite"></div>

        <button id="questionBackDynamic" class="hotspot" aria-label="Volver al cuento"></button>
        <button id="questionVoiceDynamic" class="hotspot" aria-label="Voz"></button>
        <button id="questionFullDynamic" class="hotspot" aria-label="Pantalla completa"></button>
        <button id="questionAudioDynamic" class="hotspot" aria-label="Escuchar pregunta"></button>
        <button id="rememberStoryDynamic" class="hotspot" aria-label="Recordar el texto"></button>
        <button id="answerLeftHit" class="hotspot" aria-label="Seleccionar respuesta izquierda"></button>
        <button id="answerRightHit" class="hotspot" aria-label="Seleccionar respuesta derecha"></button>
        <button id="answerLeftAudio" class="hotspot" aria-label="Escuchar respuesta izquierda"></button>
        <button id="answerRightAudio" class="hotspot" aria-label="Escuchar respuesta derecha"></button>
      </section>


      <section id="celebrationScreen" class="screen">
        <img class="art" src="assets/images/img_003_667bfd59e1dddcd5.webp" alt="Pantalla final de celebración">
        <div id="confettiLayer" aria-hidden="true"></div>
        <button id="finalTreasureHotspot" class="hotspot" aria-label="Ver mi tesoro"></button>
        <button id="finalBackHotspot" class="hotspot" aria-label="Volver a los cuentos"></button>
      </section>

      <div id="finalTreasureOverlay">
        <div class="finalTreasureCard">
          <h2>¡Mi tesoro está completo!</h2>
          <p>Encontraste los 10 diamantes.</p>
          <img id="finalTreasureChest" src="assets/images/img_004_8596d2d4c019ea9a.webp" alt="Cofre lleno con los diez diamantes">
          <div id="finalGemRow" aria-hidden="true"></div>
          <button id="closeFinalTreasure">Volver a la celebración</button>
        </div>
      </div>

      <div id="textOverlay" class="overlay">
        <div class="textCard">
          <h2 id="textTitle"></h2>
          <p id="textContent"></p>
          <div class="textActions">
            <button id="textAudioBtn" class="listenText">🔊 Escuchar texto</button>
            <button id="textCloseBtn" class="closeText">Cerrar texto</button>
          </div>
        </div>
      </div>

      <div id="simpleOverlay" class="overlay">
        <div class="simpleCard">
          <h2 id="simpleTitle"></h2>
          <p id="simpleText"></p>
          <button id="simpleClose">Volver</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>

function fit(){
  const spec=SPECS[currentScreen];
  stage.style.width=spec.w+'px';
  stage.style.height=spec.h+'px';
  const scale=Math.min(innerWidth/spec.w,innerHeight/spec.h);
  shell.style.width=(spec.w*scale)+'px';
  shell.style.height=(spec.h*scale)+'px';
  stage.style.transform=`scale(${scale})`;
  backdrop.style.backgroundImage=`url("${spec.bg}")`;
}
addEventListener('resize',fit);
document.addEventListener('fullscreenchange',()=>setTimeout(fit,60));

function show(id){
  currentScreen=id;
  ['welcome','selection','storyScreen','questionScreen','celebrationScreen'].forEach(x=>document.getElementById(x).classList.toggle('active',x===id));
  fit();
  if(id==='celebrationScreen') startFinalConfetti(); else clearFinalConfetti();
}
function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function refreshVoice(){
  if(!('speechSynthesis'in window)||voiceLocked)return;
  const voices=speechSynthesis.getVoices()||[];
  if(!voices.length)return;
  const hints=['female','mujer','femenina','paulina','sabina','dalia','monica','helena','elena','luciana','maria','sofia','valentina','camila','carolina','ximena','rosa','paloma','alma','marisol','lupe','gabriela'];
  const ranked=voices.filter(v=>/^es(?:-|$)/i.test(v.lang||'')).map(v=>{
    let score=0;const l=(v.lang||'').toLowerCase(),n=norm(v.name);
    if(/^es-(419|mx|us|ar|cl|co|pe|uy|ve)/.test(l))score+=120;
    if(hints.some(h=>n.includes(h)))score+=55;
    if(/^es-es/.test(l))score-=30;
    return [score,v];
  }).sort((a,b)=>b[0]-a[0]);
  if(ranked.length){selectedVoice=ranked[0][1];voiceLocked=true}
}
if('speechSynthesis'in window){refreshVoice();speechSynthesis.onvoiceschanged=refreshVoice;setTimeout(refreshVoice,500)}

function stopSpeech(){
  speechRequest++;
  storyAudioRequest++;
  try{speechSynthesis.cancel()}catch(e){}
  try{
    storyAudioPlayer.pause();
    storyAudioPlayer.currentTime=0;
    storyAudioPlayer.onended=null;
    storyAudioPlayer.onerror=null;
  }catch(e){}
  try{
    const v=document.getElementById('dynamicStoryVideo');
    if(v){
      v.pause();
      v.currentTime=0;
    }
  }catch(e){}
}
function speak(text,onend){
  const id=++speechRequest;
  if(muted){onend&&setTimeout(()=>id===speechRequest&&onend(),60);return}
  if(!('speechSynthesis'in window)){onend&&onend();return}
  try{speechSynthesis.cancel()}catch(e){}
  refreshVoice();
  const u=new SpeechSynthesisUtterance(text);
  if(selectedVoice)u.voice=selectedVoice;
  u.lang=selectedVoice?.lang||'es-419';
  u.rate=.88;u.pitch=1;
  u.onend=()=>{if(id===speechRequest&&onend)onend()};
  setTimeout(()=>{if(id===speechRequest)try{speechSynthesis.speak(u)}catch(e){onend&&onend()}},30);
}
function toggleVoice(){
  muted=!muted;
  stopSpeech();
  document.getElementById('voiceBtn').textContent=muted?'🔇 Voz':'🔊 Voz';
  if(!muted)speak('Voz activada.');

function playStory(){
  if(!currentStory)return;
  stopSpeech();

  if(muted)return;

  const audioSrc=STORY_AUDIO[currentStory.id];
  if(!audioSrc){
    // Respaldo únicamente si faltara un archivo de audio.
    setTimeout(()=>speak(currentStory.text,()=>setTimeout(()=>{
      storyHeard=true;
      speak('Ahora puedes responder las preguntas.');
    },1000)),1000);
    return;
  }

  const requestId=++storyAudioRequest;

  setTimeout(()=>{
    if(requestId!==storyAudioRequest || muted)return;

    try{
      storyAudioPlayer.pause();
      storyAudioPlayer.src=audioSrc;
      storyAudioPlayer.currentTime=0;

      storyAudioPlayer.onended=()=>{
        if(requestId!==storyAudioRequest)return;
        pauseCurrentStoryVideo();
        setTimeout(()=>{
          if(requestId!==storyAudioRequest)return;
          storyHeard=true;
          speak('Ahora puedes responder las preguntas.');
        },1000);
      };

      storyAudioPlayer.onerror=()=>{
        if(requestId!==storyAudioRequest)return;
        startCurrentStoryVideo();
        // Si el navegador no pudiera reproducir el MP3, conserva el respaldo de voz.
        speak(currentStory.text,()=>{
          pauseCurrentStoryVideo();
          setTimeout(()=>{
          storyHeard=true;
          speak('Ahora puedes responder las preguntas.');
        },1000);
        });
      };

      startCurrentStoryVideo();
      const playPromise=storyAudioPlayer.play();
      if(playPromise && typeof playPromise.catch==='function'){
        playPromise.catch(()=>{
          if(requestId!==storyAudioRequest)return;
          speak(currentStory.text,()=>setTimeout(()=>{
            storyHeard=true;
            speak('Ahora puedes responder las preguntas.');
          },1000));
        });
      }
    }catch(e){
      if(requestId!==storyAudioRequest)return;
      speak(currentStory.text,()=>setTimeout(()=>{
        storyHeard=true;
        speak('Ahora puedes responder las preguntas.');
      },1000));
    }
  },1000);
}

function playStoryTextNarration(){
  if(!currentStory)return;
  stopSpeech();
  if(muted)return;

  const audioSrc=STORY_AUDIO[currentStory.id];

  if(!audioSrc){
    speak(currentStory.text,()=>{storyHeard=true;});
    return;
  }

  const requestId=++storyAudioRequest;

  try{
    storyAudioPlayer.pause();
    storyAudioPlayer.src=audioSrc;
    storyAudioPlayer.currentTime=0;

    storyAudioPlayer.onended=()=>{
      if(requestId!==storyAudioRequest)return;
      storyHeard=true;
    };

    storyAudioPlayer.onerror=()=>{
      if(requestId!==storyAudioRequest)return;
      speak(currentStory.text,()=>{storyHeard=true;});
    };

    const playPromise=storyAudioPlayer.play();
    if(playPromise && typeof playPromise.catch==='function'){
      playPromise.catch(()=>{
        if(requestId!==storyAudioRequest)return;
        speak(currentStory.text,()=>{storyHeard=true;});
      });
    }
  }catch(e){
    if(requestId!==storyAudioRequest)return;
    speak(currentStory.text,()=>{storyHeard=true;});
  }
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}

function assetImg(key,extraClass=""){
  const src=SUPPORT_ASSETS[key];
  if(!src)return "";
  return `<img class="${extraClass}" src="${src}" alt="">`;
}
function colorVisual(text,color){
  const keyMap={
    "azul":"blue","rojo":"red","roja":"red","amarillo":"yellow","amarilla":"yellow",
    "morado":"purple","morada":"purple","verde":"green","naranja":"orange_color",
    "rosado":"pink","rosada":"pink","blanco":"white","blanca":"white",
    "negro":"black","negra":"black","gris":"gray","cafe":"brown"
  };
  const key=keyMap[norm(text)];
  if(key&&SUPPORT_ASSETS[key])return assetImg(key);
  return `<div class="colorBlob" style="--c:${color||"#a5adb5"}"></div>`;
}
function supportVisual(story,option){
  const v=option.visual||{};
  const text=option.t||"";

  // Reemplazos específicos solicitados por el usuario para la pantalla de preguntas.
  if(story.id==="tortuga" && v.kind==="animal"){
    if(v.animal==="turtle" && SUPPORT_ASSETS.turtle_card) return assetImg("turtle_card","sceneAsset");
    if(v.animal==="bird" && SUPPORT_ASSETS.bird_card) return assetImg("bird_card","sceneAsset");
  }

  // Preguntas de color: usar apoyo cromático, no revelar la respuesta con otro atributo.
  if(v.kind==="swatch") return colorVisual(text,v.color);
  if(v.kind==="animal" && v.color) return colorVisual(text,v.color);
  if(v.kind==="hat" && v.color) return colorVisual(text,v.color);
  if(v.kind==="wateringcan" && v.color) return colorVisual(text,v.color);
  if(v.kind==="backpack" && v.color) return colorVisual(text,v.color);

  if(v.kind==="place"){
    const key={
      forest:"forest",beach:"beach",garden:"garden",kitchen:"kitchen",pond:"pond",
      desert:"desert",farm:"farm",mountain:"mountain",city:"city",river:"river",
      sea:"sea",nightSky:"night",daySky:"day"
    }[v.place];
    if(key&&SUPPORT_ASSETS[key]) return assetImg(key,"sceneAsset placeAsset");
  }

  if(v.kind==="object"){
    if(v.object==="shell" && SUPPORT_ASSETS.shell_card) return assetImg("shell_card");
    const key={
      orange:"orange",apple:"apple",sunflower:"sunflower",rose:"rose",ball:"ball",
      kite:"kite",waterBowl:"water",milk:"milk",boat:"boat",carrot:"carrot",
      banana:"banana",shell:"shell",honey:"honey",fork:"fork",spoon:"spoon"
    }[v.object];
    if(key&&SUPPORT_ASSETS[key]) return assetImg(key);
  }

  if(v.kind==="count"){
    if(v.object==="stone") return assetImg(v.count===3?"stones3":"stones5");
    if(v.object==="nut") return assetImg(v.count===2?"nuts2":"nuts3");
  }

  if(v.kind==="relation"){
    if(v.relation==="windowCat") return assetImg("windowcat","sceneAsset");
    if(v.relation==="underTreeCat") return assetImg("treecat","sceneAsset");
    if(v.relation==="nestTree") return assetImg("nesttree","sceneAsset");
    if(v.relation==="nestCave"){
      return `<div class="relationCombo">${assetImg("cave","baseScene")}${assetImg("nest","overlayObj")}</div>`;
    }
    if(v.relation==="underLeaf" && SUPPORT_ASSETS.frog_under_leaf){
      return assetImg("frog_under_leaf","sceneAsset");
    }
    if(v.relation==="inBox" && SUPPORT_ASSETS.frog_in_box){
      return assetImg("frog_in_box","sceneAsset");
    }
    if(v.relation==="squirrelTree" && SUPPORT_ASSETS.squirrel_tree){
      return assetImg("squirrel_tree","sceneAsset");
    }
    if(v.relation==="squirrelBed" && SUPPORT_ASSETS.squirrel_bed){
      return assetImg("squirrel_bed","sceneAsset");
    }
  }

  if(v.kind==="action"){
    if(v.action==="sing") return assetImg("sing");
    if(v.action==="swimBird") return assetImg("swim");
  }

  if(v.kind==="size"){
    const key = story.id==="elefante" ? "size_elephant"
              : story.id==="mariposa" ? "size_butterfly"
              : null;
    if(key && SUPPORT_ASSETS[key]){
      const cls = v.size==="small" ? "sizeAsset sizeSmall" : "sizeAsset sizeLarge";
      return `<img class="${cls}" src="${SUPPORT_ASSETS[key]}" alt="">`;
    }
    const cls=v.size==="small"?"smallScale":"sceneAsset";
    return `<img class="${cls}" src="${story.image}" alt="">`;
  }

  if(v.kind==="name"){
    return `<img class="sceneAsset" src="${story.image}" alt="">`;
  }

  // Tipo de animal en la pregunta de Tina.
  if(v.kind==="animal" && !v.color){
    if(v.animal==="turtle" && SUPPORT_ASSETS.turtle_card) return assetImg("turtle_card","sceneAsset");
    if(v.animal==="turtle") return `<img class="sceneAsset" src="${story.image}" alt="">`;
    if(v.animal==="bird" && SUPPORT_ASSETS.bird_card) return assetImg("bird_card","sceneAsset");
    if(v.animal==="bird" && SUPPORT_ASSETS.bird) return assetImg("bird");
  }

  return `<img class="sceneAsset" src="${story.image}" alt="">`;
}

  show('questionScreen');

  const left=questionOptions[0], right=questionOptions[1];

const POSITIVE_FEEDBACK_ASSETS={"¡Excelente!":"assets/feedback/excelente.png","¡Muy bien!":"assets/feedback/muy_bien.png","¡Lo recordaste!":"assets/feedback/lo_recordaste.png","¡Genial!":"assets/feedback/genial.png","¡Correcto!":"assets/feedback/correcto.png"};
const POSITIVE_REINFORCEMENTS=[
  '¡Excelente!',
  '¡Muy bien!',
  '¡Lo recordaste!',
  '¡Genial!',
  '¡Correcto!'
];
let lastPositiveReinforcement='';
function pickDifferentReinforcement(list,last){
  const available=list.filter(x=>x!==last);
  return available[Math.floor(Math.random()*available.length)]||list[0];
}
function pickPositiveReinforcement(){
  const phrase=pickDifferentReinforcement(POSITIVE_REINFORCEMENTS,lastPositiveReinforcement);
  lastPositiveReinforcement=phrase;
  return phrase;
}

function chooseQuestionAnswer(side){
  if(questionBusy)return;
  questionBusy=true;
  const idx=side==='left'?0:1;
  const option=questionOptions[idx];
  const state=document.getElementById(side==='left'?'answerLeftState':'answerRightState');

  if(option.correct){
    state.classList.add('correct');
    const isLastQuestion=currentQuestion>=3;
    const reinforcement=pickPositiveReinforcement();
    setPositiveQuestionFeedback(reinforcement);
    speak(reinforcement,()=>{
      setTimeout(()=>{
        if(!isLastQuestion){
          currentQuestion++;
          renderQuestion();
        }else{
          finishQuestionSet();
        }
      },650);
    });
  }else{
    state.classList.add('wrong');
    setQuestionFeedback('Casi. Inténtalo otra vez.');
    speak('Casi. Escucha nuevamente e inténtalo otra vez.',()=>{
      setTimeout(()=>{
        state.classList.remove('wrong');
        setQuestionFeedback('');
        questionBusy=false;
      },450);
    });
  }
}

    return;
  }
  currentQuestion=0;
  renderQuestion();
};


/* plantilla dinámica de preguntas aprobada — dos alternativas y 4 pasos */
document.getElementById('questionBackDynamic').style.cssText='left:399px;top:80px;width:155px;height:150px;border-radius:50%';
document.getElementById('questionVoiceDynamic').style.cssText='left:1725px;top:50px;width:110px;height:110px;border-radius:50%';
document.getElementById('questionFullDynamic').style.cssText='left:1882px;top:49px;width:110px;height:110px;border-radius:50%';
document.getElementById('questionAudioDynamic').style.cssText='left:485px;top:389px;width:90px;height:90px;border-radius:50%';
document.getElementById('rememberStoryDynamic').style.cssText='left:1450px;top:340px;width:165px;height:165px;border-radius:30px';
document.getElementById('answerLeftHit').style.cssText='left:455px;top:535px;width:565px;height:300px;border-radius:34px';
document.getElementById('answerRightHit').style.cssText='left:1035px;top:535px;width:565px;height:300px;border-radius:34px';
document.getElementById('answerLeftAudio').style.cssText='left:461px;top:626px;width:88px;height:88px;border-radius:50%';
document.getElementById('answerRightAudio').style.cssText='left:1048px;top:626px;width:88px;height:88px;border-radius:50%';

document.getElementById('questionBackDynamic').onclick=()=>{stopSpeech();show('storyScreen')};
document.getElementById('questionVoiceDynamic').onclick=toggleVoice;
document.getElementById('questionFullDynamic').onclick=fullscreen;
document.getElementById('questionAudioDynamic').onclick=()=>currentStory&&speak(currentStory.questions[currentQuestion].q);
document.getElementById('rememberStoryDynamic').onclick=()=>{
  if(!currentStory)return;
  stopSpeech();
  setTimeout(()=>speak(currentStory.text),450);
};
document.getElementById('answerLeftHit').onclick=()=>chooseQuestionAnswer('left');
document.getElementById('answerRightHit').onclick=()=>chooseQuestionAnswer('right');
document.getElementById('answerLeftAudio').onclick=e=>{e.stopPropagation();questionOptions[0]&&speak(questionOptions[0].t)};
document.getElementById('answerRightAudio').onclick=e=>{e.stopPropagation();questionOptions[1]&&speak(questionOptions[1].t)};



/* pantalla final de celebración */
document.getElementById('finalTreasureHotspot').style.cssText='left:408px;top:742px;width:414px;height:132px;border-radius:55px';
document.getElementById('finalBackHotspot').style.cssText='left:850px;top:742px;width:432px;height:132px;border-radius:55px';
document.getElementById('finalTreasureHotspot').onclick=openFinalTreasure;
document.getElementById('finalBackHotspot').onclick=()=>{closeFinalTreasure();show('selection');renderDiamonds();};
document.getElementById('closeFinalTreasure').onclick=closeFinalTreasure;

/* texto opcional */
document.getElementById('textAudioBtn').onclick=playStoryTextNarration;
document.getElementById('textCloseBtn').onclick=()=>{
  stopSpeech();
  document.getElementById('textOverlay').classList.remove('show');
};
document.getElementById('simpleClose').onclick=()=>{
  document.getElementById('simpleOverlay').classList.remove('show');
  const action=simpleCloseAction;
  simpleCloseAction=null;
  if(action)action();
};

/* controles visibles de bienvenida */
document.getElementById('voiceBtn').onclick=toggleVoice;
document.getElementById('fullBtn').onclick=fullscreen;

buildSelectionHotspots();
renderDiamonds();
fit();
setTimeout(()=>speak('¡Hola! Bienvenidos a Juguemos con los cuentos.'),250);
</script>
